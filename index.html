<title>TicosCare 🐾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #F7F4EE;
  --card: #FFFFFF;
  --sage: #8FAF8E;
  --sage-light: #C8DCC7;
  --sage-dark: #4A7A49;
  --terra: #C8856A;
  --terra-light: #EDD5CC;
  --terra-dark: #A66048;
  --text: #3D3630;
  --text-muted: #8A7E76;
  --text-light: #B5A99F;
  --border: #EAE4DB;
  --gold: #C9A84C;
  --radius: 18px;
  --radius-sm: 12px;
  --bottom-nav: 70px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}

/* ─── LAYOUT ─── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

/* ─── TOP BAR ─── */
.topbar {
  background: var(--card);
  padding: 14px 18px 10px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
}
.topbar-title span { color: var(--sage-dark); }
.topbar-pill {
  background: var(--sage-light);
  color: var(--sage-dark);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
}

/* ─── SCROLL AREA ─── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(var(--bottom-nav) + var(--safe-bottom) + 16px);
}
.scroll-area::-webkit-scrollbar { display: none; }

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: var(--safe-bottom);
  z-index: 100;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 0 8px;
  gap: 3px;
  border: none;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn .nav-icon { font-size: 20px; transition: transform 0.15s; }
.nav-btn .nav-label { font-size: 0.65rem; font-weight: 500; color: var(--text-light); }
.nav-btn.active .nav-label { color: var(--sage-dark); font-weight: 700; }
.nav-btn.active .nav-icon { transform: scale(1.15); }
.nav-btn:active .nav-icon { transform: scale(0.92); }

/* ─── SECTIONS ─── */
.section { display: none; }
.section.active { display: block; }

/* ─── TODAY BANNER ─── */
.today-banner {
  background: linear-gradient(135deg, var(--sage-light) 0%, var(--terra-light) 100%);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.today-icon { font-size: 30px; flex-shrink: 0; }
.today-label { font-size: 0.65rem; font-weight: 700; color: var(--sage-dark); text-transform: uppercase; letter-spacing: 0.08em; }
.today-date { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; line-height: 1.2; margin: 2px 0; }
.today-sub { font-size: 0.75rem; color: var(--text-muted); }

/* ─── DOG CARDS ─── */
.dog-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.dog-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  active-transform: scale(0.98);
  transition: transform 0.1s;
}
.dog-card:active { transform: scale(0.98); }
.dog-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 4px 0 0 4px;
}
.dog-card.paco::before { background: var(--terra); }
.dog-card.apolo::before { background: #6B7FA8; }
.dog-card.gaia::before { background: var(--sage); }

.dog-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2.5px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.dog-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.dog-info { flex: 1; min-width: 0; }
.dog-name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 2px;
}
.dog-tasks-txt { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; }
.prog-bar { background: var(--bg); border-radius: 99px; height: 5px; overflow: hidden; margin-bottom: 3px; }
.prog-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
.paco .prog-fill { background: linear-gradient(90deg, var(--terra), #E8B09A); }
.apolo .prog-fill { background: linear-gradient(90deg, #6B7FA8, #B0BEDC); }
.gaia .prog-fill { background: linear-gradient(90deg, var(--sage), var(--sage-light)); }
.dog-pct { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }

/* ─── OVERALL ─── */
.overall-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.ov-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.ov-title { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; }
.ov-pct { font-size: 1.2rem; font-weight: 700; color: var(--sage-dark); }
.ov-bar { background: var(--bg); border-radius: 99px; height: 8px; overflow: hidden; }
.ov-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sage), var(--sage-dark)); transition: width 0.5s ease; }

/* ─── METRICS ─── */
.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric-card { background: var(--card); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
.metric-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--terra); line-height: 1; margin-bottom: 4px;
}
.metric-lbl { font-size: 0.68rem; color: var(--text-muted); line-height: 1.3; }

/* ─── ROTINA FILTERS ─── */
.filters-scroll {
  display: flex; gap: 8px;
  overflow-x: auto; padding-bottom: 2px;
  margin-bottom: 14px;
  scrollbar-width: none;
}
.filters-scroll::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 14px; border-radius: 99px;
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
  white-space: nowrap; flex-shrink: 0; cursor: pointer;
  transition: all 0.15s;
}
.chip.active { border-color: var(--sage); background: var(--sage-light); color: var(--sage-dark); font-weight: 700; }
.chip:active { transform: scale(0.95); }

/* ─── SEARCH ─── */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap input {
  width: 100%;
  padding: 11px 16px 11px 42px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; color: var(--text);
  outline: none;
  -webkit-appearance: none;
}
.search-wrap input:focus { border-color: var(--sage); }
.search-ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }

/* ─── DAY CARDS ─── */
.day-card {
  background: var(--card);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.day-card.completed { border: 1.5px solid var(--sage-light); }
.day-card.today-card-day { border: 1.5px solid var(--gold); }

.day-head {
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.day-head:active { background: var(--bg); }
.day-num { font-size: 0.65rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.06em; }
.day-datestr {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem; font-weight: 600; margin: 2px 0;
}
.day-sub { font-size: 0.72rem; color: var(--text-muted); }
.day-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-left: auto; flex-shrink: 0; }
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 99px;
}
.badge-done { background: var(--sage-light); color: var(--sage-dark); }
.badge-today { background: var(--gold); color: #fff; }
.badge-special { background: var(--terra-light); color: var(--terra-dark); }
.day-chev { font-size: 11px; color: var(--text-light); margin-top: 2px; transition: transform 0.2s; flex-shrink: 0; }
.day-card.expanded .day-chev { transform: rotate(180deg); }

.day-body { display: none; border-top: 1px solid var(--border); }
.day-card.expanded .day-body { display: block; }

.day-actions {
  display: flex; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.act-btn {
  padding: 7px 12px; border-radius: 99px;
  border: 1.5px solid var(--border); background: transparent;
  font-size: 0.72rem; font-weight: 500; color: var(--text-muted);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.act-btn:active { background: var(--bg); }

/* ─── DOG SECTIONS IN DAY ─── */
.dog-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.dog-section:last-child { border-bottom: none; }
.dts-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dts-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  overflow: hidden; border: 2px solid var(--border); flex-shrink: 0;
}
.dts-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.dts-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
.dts-badge-ok { font-size: 0.65rem; background: var(--sage-light); color: var(--sage-dark); padding: 2px 8px; border-radius: 99px; font-weight: 700; }
.dts-count { font-size: 0.7rem; color: var(--text-muted); }

.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--bg); cursor: pointer;
  transition: background 0.1s;
  min-height: 44px;
}
.task-item:active { background: var(--border); }
.task-item.done { opacity: 0.55; }
.task-item.done .task-label { text-decoration: line-through; }
.task-chk {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--card);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 10px; transition: all 0.2s;
}
.task-item.done .task-chk { background: var(--sage); border-color: var(--sage); color: white; }
.task-emoji { font-size: 16px; flex-shrink: 0; }
.task-label { font-size: 0.85rem; line-height: 1.3; }

/* ─── WEEKLY ─── */
.week-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.week-title { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
.week-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
.ws-val { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--terra); }
.ws-lbl { font-size: 0.65rem; color: var(--text-muted); }
.week-day-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem;
}
.week-day-row:last-child { border-bottom: none; }

/* ─── EMPTY ─── */
.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-icon { font-size: 44px; margin-bottom: 12px; }
.empty-text { font-size: 0.9rem; }

/* ─── PHOTO MODAL ─── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; display: none; align-items: flex-end; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  width: 100%; max-width: 430px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
.sheet-btn {
  width: 100%; padding: 14px; border-radius: 14px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600;
  cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s;
}
.sheet-btn:active { opacity: 0.75; }
.sheet-btn-primary { background: var(--sage); color: white; }
.sheet-btn-danger { background: #FEECEC; color: #C0392B; }
.sheet-btn-cancel { background: var(--bg); color: var(--text-muted); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.day-card { animation: fadeIn 0.25s ease both; }
</style>
</head>

<script>
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  if(!localStorage.getItem('ph_install_dismissed'))
    document.getElementById('installBanner').style.display='flex';
});
document.getElementById('installBtn').addEventListener('click',async function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  var res=await deferredPrompt.userChoice;
  if(res.outcome==='accepted') document.getElementById('installBanner').style.display='none';
  deferredPrompt=null;
});
window.addEventListener('appinstalled',function(){
  document.getElementById('installBanner').style.display='none';
  deferredPrompt=null;
});
function dismissInstall(){
  document.getElementById('installBanner').style.display='none';
  localStorage.setItem('ph_install_dismissed','1');
}
// SW via Blob — exatamente como na versão que funcionava
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js')
    .then(function(r){console.log('SW ok',r.scope);})
    .catch(function(e){console.warn('SW err',e);});
})
    .catch(function(e){console.warn('SW err',e);});
}
</script>

// ─── STORAGE ───
function save() {
  localStorage.setItem('ph_tasks', JSON.stringify(state.tasks));
  localStorage.setItem('ph_photos', JSON.stringify(state.photos));
  localStorage.setItem('ph_filter', state.filter);
  localStorage.setItem('ph_expanded', JSON.stringify([...expandedDays]));
}
function load() {
  try {
    const t = localStorage.getItem('ph_tasks'); if (t) state.tasks = JSON.parse(t);
    const p = localStorage.getItem('ph_photos'); if (p) state.photos = JSON.parse(p);
    const f = localStorage.getItem('ph_filter'); if (f) state.filter = f;
    const e = localStorage.getItem('ph_expanded'); if (e) expandedDays = new Set(JSON.parse(e));
  } catch(e) {}
}

// ─── DATE HELPERS ───
function allDays() {
  return Array.from({length: TOTAL_DAYS}, (_,i) => {
    const d = new Date(START); d.setDate(d.getDate() + i); return d;
  });
}
function dk(d) { return d.toISOString().split('T')[0]; }
function fmt(d) { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function isToday(d) {
  const n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function isThisWeek(d) {
  const t = new Date(), mon = new Date(t);
  mon.setDate(t.getDate() - ((t.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return d >= mon && d <= sun;
}
function isWed(d) { return d.getDay()===3; }
function isFri(d) { return d.getDay()===5; }

function dayTasks(d) {
  const t = [...DAILY_TASKS];
  if (isWed(d)) t.push({id:'ears', label:'Limpar orelhas', emoji:'👂'});
  if (isFri(d)) t.push({id:'drybath', label:'Banho a seco', emoji:'✨'});
  return t;
}

function tk(d, dog, task) { return `${dk(d)}_${dog}_${task}`; }

function dayProgress(d) {
  const tasks = dayTasks(d);
  const total = DOGS.length * tasks.length;
  const done = DOGS.reduce((a, dog) => a + tasks.filter(t => state.tasks[tk(d,dog.id,t.id)]).length, 0);
  return {total, done};
}

function dogProgress(dogId) {
  const days = allDays();
  let total=0, done=0;
  days.forEach(d => {
    const tasks = dayTasks(d);
    total += tasks.length;
    done += tasks.filter(t => state.tasks[tk(d,dogId,t.id)]).length;
  });
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}

function calcStats() {
  const days = allDays();
  let totalTasks=0, doneTasks=0, daysComp=0, baths=0, ears=0;
  days.forEach(d => {
    const tasks = dayTasks(d);
    const cnt = DOGS.length * tasks.length;
    totalTasks += cnt;
    const done = DOGS.reduce((a,dog) => a+tasks.filter(t=>state.tasks[tk(d,dog.id,t.id)]).length,0);
    doneTasks += done;
    if (done===cnt) daysComp++;
    if (isFri(d)) DOGS.forEach(dog => { if(state.tasks[tk(d,dog.id,'drybath')]) baths++; });
    if (isWed(d)) DOGS.forEach(dog => { if(state.tasks[tk(d,dog.id,'ears')]) ears++; });
  });
  const today = new Date();
  const daysRem = days.filter(d => d >= today).length;
  return {totalTasks, doneTasks, daysComp, daysRem, baths: Math.floor(baths/3), ears: Math.floor(ears/3)};
}

// ─── PHOTOS ───
function photoSrc(dogId) {
  return state.photos[dogId] || DEFAULT_PHOTOS[dogId];
}

function openPhotoModal(dogId) {
  currentDog = dogId;
  const dog = DOGS.find(d=>d.id===dogId);
  document.getElementById('modalTitle').textContent = `Foto de ${dog.name}`;
  document.getElementById('photoModal').classList.add('open');
}
function closeModal() {
  document.getElementById('photoModal').classList.remove('open');
  currentDog = null;
}
function handleBackdropClick(e) {
  if (e.target === document.getElementById('photoModal')) closeModal();
}
function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file || !currentDog) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.photos[currentDog] = ev.target.result;
    save(); closeModal(); renderAll();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function removePhoto() {
  if (!currentDog) return;
  delete state.photos[currentDog];
  save(); closeModal(); renderAll();
}

// ─── TASK TOGGLE ───
function toggleTask(dateStr, dogId, taskId) {
  const key = `${dateStr}_${dogId}_${taskId}`;
  state.tasks[key] = !state.tasks[key];
  save(); renderAll();
}
function markAll(dateStr, val) {
  const d = new Date(dateStr + 'T12:00:00');
  dayTasks(d).forEach(t => DOGS.forEach(dog => {
    state.tasks[tk(d,dog.id,t.id)] = val;
  }));
  save(); renderAll();
}

// ─── TAB SWITCH ───
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  document.getElementById('btn-'+tab).classList.add('active');
  document.getElementById('scrollArea').scrollTop = 0;
  if (tab==='rotina') renderDays();
  if (tab==='semanal') renderWeekly();
}

// ─── EXPAND/COLLAPSE ───
function toggleExpand(dkStr) {
  if (expandedDays.has(dkStr)) expandedDays.delete(dkStr);
  else expandedDays.add(dkStr);
  save();
  if (activeTab==='rotina') renderDays();
}

// ─── RENDER DASHBOARD ───
function renderDashboard() {
  const days = allDays();
  const todayDay = days.find(d => isToday(d));
  const stats = calcStats();

  document.getElementById('topPill').textContent = `Dia ${stats.daysComp} de ${TOTAL_DAYS}`;

  if (todayDay) {
    const num = days.indexOf(todayDay)+1;
    document.getElementById('todayDate').textContent = `Dia ${num} — ${WEEKDAYS[todayDay.getDay()].split('-')[0]}, ${fmt(todayDay)}`;
    const {done, total} = dayProgress(todayDay);
    document.getElementById('todayProg').textContent = `${done} de ${total} tarefas concluídas hoje`;
  } else {
    document.getElementById('todayDate').textContent = 'Fora do período da rotina';
    document.getElementById('todayProg').textContent = '05/06 → 22/07/2026';
  }

  document.getElementById('dogCards').innerHTML = DOGS.map(dog => {
    const {done, total, pct} = dogProgress(dog.id);
    return `<div class="dog-card ${dog.id}" onclick="openPhotoModal('${dog.id}')">
      <div class="dog-avatar"><img src="${photoSrc(dog.id)}" alt="${dog.name}"></div>
      <div class="dog-info">
        <div class="dog-name">${dog.name}</div>
        <div class="dog-tasks-txt">${done}/${total} tarefas</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="dog-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');

  const ovPct = stats.totalTasks ? Math.round(stats.doneTasks/stats.totalTasks*100) : 0;
  document.getElementById('ovPct').textContent = ovPct+'%';
  document.getElementById('ovFill').style.width = ovPct+'%';

  document.getElementById('metricsGrid').innerHTML = [
    {v: stats.totalTasks, l: 'Tarefas previstas'},
    {v: stats.doneTasks,  l: 'Tarefas concluídas'},
    {v: stats.daysComp,   l: 'Dias concluídos'},
    {v: stats.daysRem,    l: 'Dias restantes'},
    {v: stats.baths,      l: 'Banhos a seco'},
    {v: stats.ears,       l: 'Limpezas de orelha'},
  ].map(m => `<div class="metric-card"><div class="metric-val">${m.v}</div><div class="metric-lbl">${m.l}</div></div>`).join('');
}

// ─── RENDER DAYS ───
function renderDays() {
  const container = document.getElementById('daysContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let days = allDays();

  if (state.filter === 'today')   days = days.filter(d => isToday(d));
  else if (state.filter === 'week')   days = days.filter(d => isThisWeek(d));
  else if (state.filter === 'pending') days = days.filter(d => { const {done,total}=dayProgress(d); return done<total; });
  else if (state.filter === 'done')   days = days.filter(d => { const {done,total}=dayProgress(d); return done===total&&total>0; });

  if (search) {
    days = days.filter(d => fmt(d).includes(search) || WEEKDAYS[d.getDay()].toLowerCase().includes(search));
  }

  if (!days.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🐾</div><div class="empty-text">Nenhum dia encontrado.</div></div>';
    renderFilters(); return;
  }

  const allD = allDays();
  container.innerHTML = days.map((date, idx) => {
    const num = allD.indexOf(date)+1;
    const tasks = dayTasks(date);
    const {done, total} = dayProgress(date);
    const pct = total ? Math.round(done/total*100) : 0;
    const comp = done===total && total>0;
    const today = isToday(date);
    const isExp = expandedDays.has(dk(date));
    const dkStr = dk(date);

    const badges = [];
    if (today) badges.push('<span class="badge badge-today">⭐ Hoje</span>');
    if (comp) badges.push('<span class="badge badge-done">✅ Concluído</span>');
    if (isFri(date)) badges.push('<span class="badge badge-special">✨ Banho a seco</span>');
    if (isWed(date)) badges.push('<span class="badge badge-special">👂 Orelhas</span>');

    const dogSects = DOGS.map(dog => {
      const dogDone = tasks.filter(t => state.tasks[tk(date,dog.id,t.id)]).length;
      const dogComp = dogDone===tasks.length;
      const taskItems = tasks.map(t => {
        const isDone = !!state.tasks[tk(date,dog.id,t.id)];
        return `<div class="task-item ${isDone?'done':''}" onclick="toggleTask('${dkStr}','${dog.id}','${t.id}')">
          <div class="task-chk">${isDone?'✓':''}</div>
          <span class="task-emoji">${t.emoji}</span>
          <span class="task-label">${t.label}</span>
        </div>`;
      }).join('');
      return `<div class="dog-section">
        <div class="dts-header">
          <div class="dts-avatar"><img src="${photoSrc(dog.id)}" alt="${dog.name}"></div>
          <div class="dts-name">${dog.name}</div>
          ${dogComp
            ? '<span class="dts-badge-ok">🏆 Tudo certo!</span>'
            : `<span class="dts-count">${dogDone}/${tasks.length}</span>`
          }
        </div>
        <div class="task-list">${taskItems}</div>
      </div>`;
    }).join('');

    return `<div class="day-card ${comp?'completed':''} ${today?'today-card-day':''} ${isExp?'expanded':''}"
        id="day-${dkStr}" style="animation-delay:${Math.min(idx,8)*0.03}s">
      <div class="day-head" onclick="toggleExpand('${dkStr}')">
        <div>
          <div class="day-num">Dia ${num}</div>
          <div class="day-datestr">${WEEKDAYS[date.getDay()]}, ${fmt(date)}</div>
          <div class="day-sub">${done}/${total} tarefas · ${pct}%</div>
        </div>
        <div class="day-badges">${badges.join('')}</div>
        <div class="day-chev">▼</div>
      </div>
      <div class="day-body">
        <div class="day-actions">
          <button class="act-btn" onclick="markAll('${dkStr}', true)">✅ Marcar todas</button>
          <button class="act-btn" onclick="markAll('${dkStr}', false)">🗑️ Limpar</button>
        </div>
        ${dogSects}
      </div>
    </div>`;
  }).join('');

  renderFilters();
}

// ─── RENDER FILTERS ───
function renderFilters() {
  const row = document.getElementById('filtersRow');
  const opts = [
    {id:'all',     l:'📅 Todos'},
    {id:'today',   l:'⭐ Hoje'},
    {id:'week',    l:'📆 Semana'},
    {id:'pending', l:'⏳ Pendentes'},
    {id:'done',    l:'✅ Concluídos'},
  ];
  row.innerHTML = opts.map(o =>
    `<div class="chip ${state.filter===o.id?'active':''}" onclick="setFilter('${o.id}')">${o.l}</div>`
  ).join('');
}

function setFilter(f) {
  state.filter = f; save(); renderDays();
}

// ─── RENDER WEEKLY ───
function renderWeekly() {
  const days = allDays();
  const weeks = [];
  let w = [];
  days.forEach((d,i) => {
    w.push(d);
    if (d.getDay()===0 || i===days.length-1) { weeks.push([...w]); w=[]; }
  });
  if (w.length) weeks.push(w);

  document.getElementById('weeklyContainer').innerHTML = weeks.map((wd, wi) => {
    let tot=0, don=0;
    wd.forEach(d => { const p=dayProgress(d); tot+=p.total; don+=p.done; });
    const pct = tot ? Math.round(don/tot*100) : 0;
    const dayRows = wd.map(d => {
      const num = days.indexOf(d)+1;
      const p = dayProgress(d);
      const c = p.done===p.total && p.total>0;
      const tod = isToday(d);
      return `<div class="week-day-row" style="${tod?'font-weight:600':''}">
        <div>
          <span style="color:var(--text-muted);font-size:0.68rem">Dia ${num} · </span>
          ${WEEKDAYS[d.getDay()].split('-')[0]}, ${fmt(d)}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--text-muted);font-size:0.75rem">${p.done}/${p.total}</span>
          ${c?'<span style="font-size:13px">✅</span>':''}
          ${tod?'<span style="font-size:13px">⭐</span>':''}
        </div>
      </div>`;
    }).join('');

    return `<div class="week-card">
      <div class="week-title">Semana ${wi+1} · ${fmt(wd[0])} → ${fmt(wd[wd.length-1])}</div>
      <div class="week-stats">
        <div><div class="ws-val">${pct}%</div><div class="ws-lbl">Concluído</div></div>
        <div><div class="ws-val">${don}</div><div class="ws-lbl">Feitas</div></div>
        <div><div class="ws-val">${tot-don}</div><div class="ws-lbl">Pendentes</div></div>
      </div>
      <div class="ov-bar" style="margin-bottom:14px">
        <div class="ov-fill" style="width:${pct}%"></div>
      </div>
      ${dayRows}
    </div>`;
  }).join('');
}

// ─── RENDER ALL ───
function renderAll() {
  renderDashboard();
  if (activeTab==='rotina') renderDays();
  if (activeTab==='semanal') renderWeekly();
}

// ─── INIT ───
load();
const days = allDays();
const todayDay = days.find(d => isToday(d));
if (todayDay) expandedDays.add(dk(todayDay));
renderAll();
renderFilters();
</script>
